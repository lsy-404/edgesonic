name: Deploy Installer Relay

# Manual-only trigger. Deploys relay/ to the project's own Cloudflare
# account (repo secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID) — this
# is shared infrastructure the installer calls, not something an end user
# deploys for themselves.
on:
  workflow_dispatch:
    inputs:
      allowed_origins:
        description: 'Comma-separated exact-match allowlist of installer origins (e.g. https://<user>.github.io)'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy relay
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check required secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Missing repo secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "::add-mask::${ACCOUNT}"

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: relay
        run: npm install

      - name: Generate wrangler.toml
        working-directory: relay
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORIGINS: ${{ inputs.allowed_origins }}
        run: |
          set -euo pipefail
          sed \
            -e "s|<YOUR_CLOUDFLARE_ACCOUNT_ID>|${CF_ACCOUNT_ID}|g" \
            -e "s|<https://your-installer.github.io>|${ORIGINS}|" \
            wrangler.toml.example > wrangler.toml

      - name: Deploy
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
