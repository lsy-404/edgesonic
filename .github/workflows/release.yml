name: Release EdgeSonic (precompiled package)

# Builds a self-contained, ready-to-deploy package and publishes it as a
# GitHub Release asset. Unlike deploy.yml, this workflow needs no Cloudflare
# credentials — it builds and packages. It does require the repository's
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets to publish the public
# container image that Cloudflare can pull. Deployment happens later,
# wherever the package is downloaded to, via `wrangler`.
#
# The package contains a prebuilt web/dist and an isolated worker/node_modules
# (worker's own runtime deps only — hono + @cloudflare/sandbox), so consuming
# it never requires dependency installation / `pnpm run build:web` again. See
# docs/DEPLOY_BY_AGENT.md for the consumer-side deploy steps.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish under (e.g. v1.2.3) — required for manual runs"
        required: true
        type: string
      allow_major_update:
        description: "Explicitly allow the in-app updater to cross a Major version boundary"
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build & Publish Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cloudflare Containers accepts public Docker Hub references, while it
      # does not pull directly from GHCR. Keep the GHCR image for project
      # consumers, and publish the same immutable tag to Docker Hub for the
      # browser deployment package. Configure repository secrets
      # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN before cutting a release.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish transcoder image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: worker/transcoder-image
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/edgesonic-transcoder:${{ steps.tag.outputs.tag }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/edgesonic-transcoder:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}

      - name: Install monorepo dependencies (build tooling)
        run: pnpm install --frozen-lockfile

      - name: Install Wrangler CLI
        run: pnpm exec wrangler --version

      - name: Build frontend
        run: |
          pnpm run build:web
          test -s web/dist/build-info.json

      - name: Assemble release package
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/edgesonic-release"
          rm -rf "$STAGE" edgesonic-release.tar.gz edgesonic-release.tar.gz.sha256
          pnpm --filter edgesonic --prod deploy "$STAGE/worker"
          mkdir -p "$STAGE/web"
          cp -r web/dist "$STAGE/web/dist"
          cp -r shared "$STAGE/shared"
          cp docs/DEPLOY_BY_AGENT.md "$STAGE/"
          test -d "$STAGE/worker/node_modules/hono"
          test -d "$STAGE/worker/node_modules/@cloudflare/sandbox"
          cp worker/update-wrangler.toml "$STAGE/worker/verify-wrangler.toml"
          pnpm exec wrangler deploy --dry-run \
            --config "$STAGE/worker/verify-wrangler.toml" \
            --outdir "${RUNNER_TEMP}/verify-out" \
            || { echo "::error::The assembled package does not bundle."; exit 1; }
          rm -f "$STAGE/worker/verify-wrangler.toml"

          tar czf edgesonic-release.tar.gz -C "$RUNNER_TEMP" edgesonic-release
          sha256sum edgesonic-release.tar.gz > edgesonic-release.tar.gz.sha256

      - name: Build API update artifact
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          ALLOW_MAJOR: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_major_update || false }}
          IMAGE_REPOSITORY: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/edgesonic-transcoder
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          BUILD_INFO=$(cat web/dist/build-info.json)
          VERSION=$(node -e 'console.log(JSON.parse(process.argv[1]).version.replace(/-dev\.[^-]+(?:-dirty)?$|-dirty$/, ""))' "$BUILD_INFO")
          BUILD_TIME=$(node -e 'console.log(JSON.parse(process.argv[1]).buildTime)' "$BUILD_INFO")
          API_STAGE="${RUNNER_TEMP}/edgesonic-update-stage"
          node scripts/build-update-bundle.mjs "$API_STAGE" "$VERSION" "$BUILD_TIME" "$ALLOW_MAJOR" "$TAG" "$IMAGE_REPOSITORY" "$IMAGE_DIGEST"
          cp "${RUNNER_TEMP}/edgesonic-update.tar.gz" .
          cp "${RUNNER_TEMP}/edgesonic-update.tar.gz.sha256" .
          cp "${RUNNER_TEMP}/edgesonic-update-manifest.json" .
          sha256sum -c edgesonic-update.tar.gz.sha256
          # Same build, second consumer: the browser deploy wizard's package.
          cp "${RUNNER_TEMP}/overture.tar.gz" .
          cp "${RUNNER_TEMP}/overture.tar.gz.sha256" .
          cp "${RUNNER_TEMP}/overture.json" .
          sha256sum -c overture.tar.gz.sha256

      - name: Generate commit summary
        id: notes
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "Precompiled deploy package (prebuilt web/dist + isolated worker/node_modules — no pnpm install --frozen-lockfile / build needed)."
            echo
            echo "## Changes"
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --no-merges --format='- %s' "${PREVIOUS_TAG}..${TAG}"
            else
              echo "- Initial release"
            fi
          } > release-notes.md
          printf 'Generated release notes:\n'
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          # Idempotent publish: update both notes and assets when a release
          # already exists (workflow re-run, re-pushed tag, or retry).
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists — replacing notes and assets."
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "EdgeSonic $TAG" \
              --notes-file release-notes.md
            gh release upload "$TAG" \
              edgesonic-release.tar.gz \
              edgesonic-release.tar.gz.sha256 \
              edgesonic-update.tar.gz \
              edgesonic-update.tar.gz.sha256 \
              edgesonic-update-manifest.json \
              overture.tar.gz \
              overture.tar.gz.sha256 \
              overture.json \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "$TAG" \
              edgesonic-release.tar.gz \
              edgesonic-release.tar.gz.sha256 \
              edgesonic-update.tar.gz \
              edgesonic-update.tar.gz.sha256 \
              edgesonic-update-manifest.json \
              overture.tar.gz \
              overture.tar.gz.sha256 \
              overture.json \
              --repo "${{ github.repository }}" \
              --title "EdgeSonic $TAG" \
              --notes-file release-notes.md
          fi
